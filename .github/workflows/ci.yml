name: Lint and test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  SAFE_CHAIN_VERSION: 1.5.3

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v2
        with:
          node-version: 24
      - name: Install Aikido Safe Chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_VERSION}/install-safe-chain.sh | sh -s -- --ci
          echo "$HOME/.safe-chain/shims" >> "$GITHUB_PATH"
          echo "$HOME/.safe-chain/bin" >> "$GITHUB_PATH"
      - name: Verify Aikido Safe Chain
        run: safe-chain --version
      - name: Install eslint
        run: npm install eslint
      - name: Run lint
        run: npm run lint

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v2
        with:
          node-version: 24
      - name: Install Aikido Safe Chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_VERSION}/install-safe-chain.sh | sh -s -- --ci
          echo "$HOME/.safe-chain/shims" >> "$GITHUB_PATH"
          echo "$HOME/.safe-chain/bin" >> "$GITHUB_PATH"
      - name: Verify Aikido Safe Chain
        run: safe-chain --version
      # --ignore-scripts skips the Cypress binary download; these tests are
      # server-side only and need no browser.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run integration tests
        run: npm run test:integration

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v2
        with:
          node-version: 24

      - name: Install Aikido Safe Chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_VERSION}/install-safe-chain.sh | sh -s -- --ci
          echo "$HOME/.safe-chain/shims" >> "$GITHUB_PATH"
          echo "$HOME/.safe-chain/bin" >> "$GITHUB_PATH"
      - name: Verify Aikido Safe Chain
        run: safe-chain --version

      - name: Test
        run: npm run test
