name: Lint and test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  SAFE_CHAIN_VERSION: 1.5.3

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: 14.17
      - name: Install Aikido Safe Chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_VERSION}/install-safe-chain.sh | sh -s -- --ci
          echo "$HOME/.safe-chain/shims" >> "$GITHUB_PATH"
          echo "$HOME/.safe-chain/bin" >> "$GITHUB_PATH"
      - name: Verify Aikido Safe Chain
        run: safe-chain --version
      - name: Install eslint
        run: npm install eslint
      - name: Run lint
        run: npm run lint

  build-and-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - uses: actions/setup-node@v2
        with:
          node-version: 14.17

      - name: Install Aikido Safe Chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_VERSION}/install-safe-chain.sh | sh -s -- --ci
          echo "$HOME/.safe-chain/shims" >> "$GITHUB_PATH"
          echo "$HOME/.safe-chain/bin" >> "$GITHUB_PATH"
      - name: Verify Aikido Safe Chain
        run: safe-chain --version

      - name: Test
        run: npm run test
