name: Release production

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: suoritustarkistin
          tags: production ${{ github.sha }}
          # buildah-build v3 changed the default to true
          squash: false
          containerfiles: |
            ./Dockerfile
          build-args: |
            BASE_PATH=/suoritustarkistin/
            NODE_ENV=production
            VITE_SENTRY_RELEASE=${{ github.sha }}

      - name: Push to version helsinki
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: registry.version.helsinki.fi/toska/openshift/kontit/
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}

  sentry-release:
    runs-on: ubuntu-latest
    needs: publish
    if: success()
    steps:
      - uses: actions/checkout@v7
      - name: Pull image and create a container
        run: docker create --name suotar quay.io/toska/suoritustarkistin:production
      - name: Copy assets from the container
        run: docker cp suotar:/opt/app-root/src ./app
      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: suotar
        with:
          # must match VITE_SENTRY_RELEASE baked into the image above
          version: ${{ github.sha }}
          environment: production
          set_commits: 'skip'
          sourcemaps: ./app
          url_prefix: '~/app'

  report_success:
    name: 'Report deployment success to Suotar-channel'
    runs-on: ubuntu-latest
    needs:
      - publish
      - sentry-release
    if: success()
    steps:
      - name: 'Send notification to Slack'
        uses: UniversityOfHelsinkiCS/slackbot-action@v1.5
        with:
          webhook-url: ${{ secrets.SLACKBOT_URL }}
          message-type: deployment
          softa-url: https://opetushallinto.cs.helsinki.fi/suoritustarkistin/
          deployment-target: production

  report_failure:
    name: 'Report deployment failure to Suotar-channel'
    runs-on: ubuntu-latest
    needs:
      - publish
    if: failure()
    steps:
      - name: 'Send notification to Slack'
        uses: UniversityOfHelsinkiCS/slackbot-action@v1.5
        with:
          webhook-url: ${{ secrets.SLACKBOT_URL }}
          message-type: deployment-failure
