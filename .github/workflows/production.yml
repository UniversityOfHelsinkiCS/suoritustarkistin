name: Release production

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: suoritustarkistin
          tags: production ${{ github.sha }}
          # buildah-build v3 changed the default to true
          squash: false
          containerfiles: |
            ./Dockerfile
          build-args: |
            BASE_PATH=/suoritustarkistin/
            NODE_ENV=production
            SENTRY_RELEASE=${{ github.sha }}

      - name: Push to version helsinki
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: registry.version.helsinki.fi/toska/openshift/kontit/
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}

  sentry-release:
    runs-on: ubuntu-latest
    needs: publish
    if: success()
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: registry.version.helsinki.fi
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}
      # The sha tag rather than :production, so the sourcemaps are guaranteed to come
      # from the image this run built and not from whatever :production points at now.
      - name: Pull image and create a container
        run: |
          docker create --name suotar \
            registry.version.helsinki.fi/toska/openshift/kontit/suoritustarkistin:${{ github.sha }}
      - name: Copy the built client from the container
        run: docker cp suotar:/opt/app-root/src/dist ./dist
      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          # Sourcemaps only exist for the client, which reports to its own project
          SENTRY_PROJECT: suotar-frontend
        with:
          # must match the SENTRY_RELEASE baked into the image above
          release: ${{ github.sha }}
          environment: production
          set_commits: 'skip'
          # url_prefix must match the path the browser reports. BASE_PATH is
          # /suoritustarkistin/ and vite.config.mjs pins the entry to main.js, so the
          # bundle is served from /suoritustarkistin/main.js.
          sourcemaps: ./dist
          url_prefix: '~/suoritustarkistin'
          # This dist is extracted from an image that has already been built and pushed,
          # so injecting debug ids here would rewrite the bundle and its map while the
          # deployed bundle stays as-is, leaving the uploaded map describing a file
          # nobody serves. Matching stays release- and path-based.
          # To adopt debug ids, inject during the image build instead (needs no token),
          # then this can go back to the v3 default.
          inject: false

  report_success:
    name: 'Report deployment success to Suotar-channel'
    runs-on: ubuntu-latest
    needs:
      - publish
      - sentry-release
    if: success()
    steps:
      - name: 'Send notification to Slack'
        uses: UniversityOfHelsinkiCS/slackbot-action@v1.5
        with:
          webhook-url: ${{ secrets.SLACKBOT_URL }}
          message-type: deployment
          softa-url: https://opetushallinto.cs.helsinki.fi/suoritustarkistin/
          deployment-target: production

  report_failure:
    name: 'Report deployment failure to Suotar-channel'
    runs-on: ubuntu-latest
    needs:
      - publish
    if: failure()
    steps:
      - name: 'Send notification to Slack'
        uses: UniversityOfHelsinkiCS/slackbot-action@v1.5
        with:
          webhook-url: ${{ secrets.SLACKBOT_URL }}
          message-type: deployment-failure
